name: Daily Weather · Poissy

on:
  schedule:
    - cron: '0 5 * * *'  # 7 AM Paris time (CEST/UTC+2). In winter (CET) arrives at 6 AM.
  workflow_dispatch:      # trigger manually to test

permissions:
  contents: write         # needed to push the log commit

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather, send email, append to log
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, smtplib, os
          from email.mime.text import MIMEText
          from datetime import datetime

          WMO = {
            0: "Clear sky ☀️", 1: "Mainly clear \U0001f324️", 2: "Partly cloudy ⛅", 3: "Overcast ☁️",
            45: "Fog \U0001f32b️", 48: "Icy fog \U0001f32b️",
            51: "Light drizzle \U0001f326️", 53: "Drizzle \U0001f326️", 55: "Heavy drizzle \U0001f326️",
            61: "Light rain \U0001f327️", 63: "Rain \U0001f327️", 65: "Heavy rain \U0001f327️",
            71: "Light snow \U0001f328️", 73: "Snow \U0001f328️", 75: "Heavy snow ❄️",
            80: "Light showers \U0001f326️", 81: "Showers \U0001f326️", 82: "Heavy showers ⛈️",
            95: "Thunderstorm ⛈️", 96: "Thunderstorm + hail ⛈️", 99: "Thunderstorm + heavy hail ⛈️",
          }

          url = (
            "https://api.open-meteo.com/v1/forecast"
            "?latitude=48.9295&longitude=2.0448"
            "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,"
            "uv_index_max,sunrise,sunset,weathercode,precipitation_probability_max"
            "&current=temperature_2m,wind_speed_10m,relative_humidity_2m"
            "&timezone=Europe%2FParis&forecast_days=1"
          )

          with urllib.request.urlopen(url) as r:
            data = json.loads(r.read())

          d = data['daily']
          c = data['current']

          condition = WMO.get(d['weathercode'][0], "Code {}".format(d['weathercode'][0]))
          tmax      = d['temperature_2m_max'][0]
          tmin      = d['temperature_2m_min'][0]
          uv        = d['uv_index_max'][0]
          rain_prob = d['precipitation_probability_max'][0]
          rain_mm   = d['precipitation_sum'][0]
          sunrise   = d['sunrise'][0].split('T')[1]
          sunset    = d['sunset'][0].split('T')[1]
          temp_now  = c['temperature_2m']
          humidity  = c['relative_humidity_2m']
          wind      = c['wind_speed_10m']

          uv_dot    = "\U0001f7e2" if uv < 3 else "\U0001f7e1" if uv < 6 else "\U0001f7e0" if uv < 8 else "\U0001f534" if uv < 11 else "\U0001f7e3"
          uv_advice = (
            "Low - no protection needed"        if uv < 3  else
            "Moderate - sunscreen if out >1 h"  if uv < 6  else
            "High - sunscreen + hat"            if uv < 8  else
            "Very High - limit midday exposure" if uv < 11 else
            "Extreme - avoid sun 10 am to 4 pm"
          )

          today_long  = datetime.now().strftime('%A %d %B %Y')
          today_short = datetime.now().strftime('%Y-%m-%d %a')

          lines = [
            "Good morning! Weather for Poissy on {}".format(today_long),
            "",
            "Condition    {}".format(condition),
            "Now          {}C  humidity {}%  wind {} km/h".format(temp_now, humidity, wind),
            "Today        {}C - {}C".format(tmin, tmax),
            "Rain         {}% chance  ({} mm expected)".format(rain_prob, rain_mm),
            "Sunrise      {}   Sunset {}".format(sunrise, sunset),
            "",
            "UV Index     {}  {}  {}".format(uv, uv_dot, uv_advice),
            "",
            "-- LocaLens Daily  localens.pages.dev",
          ]
          body = "\n".join(lines)

          msg = MIMEText(body, 'plain')
          msg['Subject'] = "Poissy {}  UV {}  {}-{}C  {}".format(today_long[:3], uv, tmin, tmax, condition)
          msg['From'] = 'lawrencejohny@gmail.com'
          msg['To']   = 'lawrence.mk.johny@gmail.com'

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
            s.starttls()
            s.login(addr, os.environ['GMAIL_APP_PASSWORD'])
            s.send_message(msg)
            print("Email sent.")

          log_path = 'weather-log.md'
          header = (
            "# Poissy - Daily Weather Log\n\n"
            "| Date | Condition | Temp | UV | Rain |\n"
            "|------|-----------|------|----|------|\n"
          )
          row = "| {} | {} | {}-{}C | {} {} | {}% |\n".format(
            today_short, condition, tmin, tmax, uv, uv_dot, rain_prob
          )

          if not os.path.exists(log_path):
            with open(log_path, 'w') as f:
              f.write(header)

          with open(log_path, 'a') as f:
            f.write(row)

          print("Log updated: {}".format(row.strip()))
          PYEOF

      - name: Commit weather log
        run: |
          git config user.name  "ljo3"
          git config user.email "lawrence.mk.johny@gmail.com"
          git add weather-log.md
          git diff --staged --quiet || git commit -m "Weather log $(date -u +%Y-%m-%d)"
          git push
