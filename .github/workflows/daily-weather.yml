name: Daily Weather · Poissy

on:
  schedule:
    - cron: '0 5 * * *'  # 7 AM Paris time (CEST/UTC+2). In winter (CET) this arrives at 6 AM.
  workflow_dispatch:      # lets you trigger manually to test

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch weather and send email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, smtplib, os
          from email.mime.text import MIMEText
          from datetime import datetime

          WMO = {
            0: "Clear sky ☀️", 1: "Mainly clear 🌤️", 2: "Partly cloudy ⛅", 3: "Overcast ☁️",
            45: "Fog 🌫️", 48: "Icy fog 🌫️",
            51: "Light drizzle 🌦️", 53: "Drizzle 🌦️", 55: "Heavy drizzle 🌦️",
            61: "Light rain 🌧️", 63: "Rain 🌧️", 65: "Heavy rain 🌧️",
            71: "Light snow 🌨️", 73: "Snow 🌨️", 75: "Heavy snow ❄️",
            80: "Light showers 🌦️", 81: "Showers 🌦️", 82: "Heavy showers ⛈️",
            95: "Thunderstorm ⛈️", 96: "Thunderstorm + hail ⛈️", 99: "Thunderstorm + heavy hail ⛈️",
          }

          url = (
            "https://api.open-meteo.com/v1/forecast"
            "?latitude=48.9295&longitude=2.0448"
            "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,"
            "uv_index_max,sunrise,sunset,weathercode,precipitation_probability_max"
            "&current=temperature_2m,wind_speed_10m,relative_humidity_2m"
            "&timezone=Europe%2FParis&forecast_days=1"
          )

          with urllib.request.urlopen(url) as r:
            data = json.loads(r.read())

          d  = data['daily']
          c  = data['current']
          today = datetime.now().strftime('%A %d %B %Y')

          condition    = WMO.get(d['weathercode'][0], f"Code {d['weathercode'][0]}")
          tmax         = d['temperature_2m_max'][0]
          tmin         = d['temperature_2m_min'][0]
          uv           = d['uv_index_max'][0]
          rain_prob    = d['precipitation_probability_max'][0]
          rain_mm      = d['precipitation_sum'][0]
          sunrise      = d['sunrise'][0].split('T')[1]
          sunset       = d['sunset'][0].split('T')[1]
          temp_now     = c['temperature_2m']
          humidity     = c['relative_humidity_2m']
          wind         = c['wind_speed_10m']

          uv_advice = (
            "Low · no protection needed"        if uv < 3  else
            "Moderate · sunscreen if out >1 h"  if uv < 6  else
            "High · sunscreen + hat"            if uv < 8  else
            "Very High · limit midday exposure" if uv < 11 else
            "Extreme · avoid sun 10 am – 4 pm"
          )
          uv_dot = "🟢" if uv < 3 else "🟡" if uv < 6 else "🟠" if uv < 8 else "🔴" if uv < 11 else "🟣"

          body = f"""Good morning! Weather for Poissy on {today}

Condition    {condition}
Now          {temp_now}°C  ·  humidity {humidity}%  ·  wind {wind} km/h
Today        {tmin}°C – {tmax}°C
Rain         {rain_prob}% chance  ({rain_mm} mm expected)
Sunrise      {sunrise}   Sunset {sunset}

UV Index     {uv}  {uv_dot}  {uv_advice}

— LocaLens Daily  ·  localens.pages.dev
"""

          msg = MIMEText(body, 'plain')
          msg['Subject'] = f"☀️ Poissy {today[:3]}  UV {uv}  {tmin}–{tmax}°C  {condition}"
          msg['From']    = 'lawrence.mk.johny@gmail.com'
          msg['To']      = 'lawrence.mk.johny@gmail.com'

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
            s.starttls()
            s.login('lawrence.mk.johny@gmail.com', os.environ['GMAIL_APP_PASSWORD'])
            s.send_message(msg)
            print("Email sent.")
          PYEOF
